
name: Build IRONNOVA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate inline JavaScript
        run: node scripts/check-inline-js.mjs

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/
          [ ! -d assets ] || cp -r assets www/
          [ ! -f manifest.webmanifest ] || cp manifest.webmanifest www/
          [ ! -f service-worker.js ] || cp service-worker.js www/
          [ ! -f sw.js ] || cp sw.js www/

      - name: Create Android project
        run: npx cap add android

      - name: Register native audio plugin
        run: node scripts/prepare-android.mjs

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRONNOVA-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
