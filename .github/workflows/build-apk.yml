
name: Build IRONNOVA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/home-training-hub
      - release/ironnova-exercise-images
      - feature/admin-app-diagnostics
      - feature/2026-11-26-visual-refresh-six-digit-codes
      - feature/reference-match-2026-11-26

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install icon generator dependency
        run: python3 -m pip install --disable-pip-version-check Pillow

      - name: Generate IRONNOVA app icons
        run: python3 scripts/generate-icons.py

      - name: Validate inline JavaScript
        run: node scripts/check-inline-js.mjs

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Assemble and verify high-resolution IRONNOVA splash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import base64
          import string
          import hashlib
          from PIL import Image

          folder = Path('.github/splash-parts')
          files = sorted(folder.glob('*.b64'), key=lambda p: p.name)
          parts = {p.name: p.read_text().strip() for p in files}
          ordered = [parts[p.name] for p in files]
          encoded = ''.join(ordered)

          # One character was lost while transferring segment 08c. Restore it
          # against the actual WebP decoder before packaging, never ship a broken image.
          if len(encoded) != 113796:
              target = '08c.b64'
              broken = parts[target]
              prefix = ''.join(parts[p.name] for p in files if p.name < target)
              suffix = ''.join(parts[p.name] for p in files if p.name > target)
              alphabet = string.ascii_letters + string.digits + '+/'
              recovered = None
              for position in range(len(broken) + 1):
                  left, right = broken[:position], broken[position:]
                  for char in alphabet:
                      candidate = prefix + left + char + right + suffix
                      try:
                          raw = base64.b64decode(candidate, validate=True)
                          if len(raw) != 85346:
                              continue
                          if hashlib.sha256(raw).hexdigest() != '242a00d75d3fcc0c836cdd3793e19cf6fc9765659c4f1d997264724baea3768f':
                              continue
                          recovered = raw
                          break
                      except Exception:
                          continue
                  if recovered is not None:
                      break
              if recovered is None:
                  raise SystemExit('Could not restore splash payload; refusing to build a broken APK')
              Path('assets/ironnova-splash.webp').write_bytes(recovered)
          else:
              raw = base64.b64decode(encoded, validate=True)
              Path('assets/ironnova-splash.webp').write_bytes(raw)

          p = Path('assets/ironnova-splash.webp')
          with Image.open(p) as image:
              assert image.format == 'WEBP', image.format
              assert image.size == (941, 1672), image.size
              image.load()
          assert p.stat().st_size == 85346, p.stat().st_size
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '242a00d75d3fcc0c836cdd3793e19cf6fc9765659c4f1d997264724baea3768f'
          print(f'Verified IRONNOVA splash: 941x1672, {p.stat().st_size} bytes')
          PY

      - name: Build offline licensed exercise image catalog
        run: |
          python3 -m py_compile scripts/build-exercise-assets.py
          python3 scripts/build-exercise-assets.py

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/
          [ ! -d assets ] || cp -r assets www/
          [ ! -f manifest.webmanifest ] || cp manifest.webmanifest www/
          [ ! -f service-worker.js ] || cp service-worker.js www/
          [ ! -f sw.js ] || cp sw.js www/

      - name: Validate push bridge
        run: node --input-type=module --check < scripts/iron-push.js

      - name: Bundle native push bridge
        run: npx esbuild scripts/iron-push.js --bundle --format=iife --outfile=www/iron-push.js

      - name: Bundle native Android back handler
        run: npx esbuild scripts/iron-back.js --bundle --format=iife --outfile=www/iron-back.js

      - name: Create Android project
        run: npx cap add android

      - name: Generate Android launcher icons
        run: python3 scripts/generate-icons.py --android-res android/app/src/main/res

      - name: Add Firebase Android configuration
        run: cp google-services.json android/app/google-services.json

      - name: Add Android media permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permissions = ['<uses-permission android:name="android.permission.RECORD_AUDIO" />', '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />']
          for permission in permissions:
              if permission not in s:
                  s = s.replace('<application', permission + '\n    <application', 1)
          p.write_text(s)
          PY

      - name: Sync Android
        run: npx cap sync android

      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ironnova-android-debug-keystore-v1

      - name: Ensure stable Android debug signing key
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build signed Release APK
        id: release-signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        continue-on-error: true
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/ironnova-release.jks
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle')
          s = p.read_text()
          if 'signingConfigs {' not in s:
              m = re.search(r'(?m)^\s*buildTypes\s*\{', s)
              if not m:
                  raise SystemExit('Could not find Android buildTypes block')
              signing = '''
              signingConfigs {
                  release {
                      storeFile file('../ironnova-release.jks')
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias 'ironnova-release'
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              }

          '''
              s = s[:m.start()] + signing + s[m.start():]
          build_types = re.search(r'(?m)^\s*buildTypes\s*\{', s)
          if not build_types:
              raise SystemExit('Could not find Android buildTypes block')
          release = re.search(r'(?m)^([ \t]*)release\s*\{', s[build_types.end():])
          if not release:
              raise SystemExit('Could not find release buildType inside buildTypes')
          insert_at = build_types.end() + release.end()
          if 'signingConfig signingConfigs.release' not in s[insert_at:insert_at+250]:
              s = s[:insert_at] + "\n" + release.group(1) + "    signingConfig signingConfigs.release" + s[insert_at:]
          p.write_text(s)
          PY
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -n 1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          keytool -list -keystore android/ironnova-release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias ironnova-release >/dev/null
          rm -f android/ironnova-release.jks

      - name: Upload signed Release APK
        if: steps.release-signing.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: IRONNOVA-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRONNOVA-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
