
name: Build IRONNOVA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install icon generator dependency
        run: python3 -m pip install --disable-pip-version-check Pillow

      - name: Generate IRONNOVA app icons
        run: python3 scripts/generate-icons.py

      - name: Validate inline JavaScript
        run: node scripts/check-inline-js.mjs

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Restore and validate offline exercise assets
        run: |
          mkdir -p assets
          if [ -f IRONNOVA-exercise-assets.zip.part-00 ] || [ -f IRONNOVA-exercise-assets.zip.part-01 ]; then
            test -f IRONNOVA-exercise-assets.zip.part-00
            test -f IRONNOVA-exercise-assets.zip.part-01
            cat IRONNOVA-exercise-assets.zip.part-00 IRONNOVA-exercise-assets.zip.part-01 > /tmp/IRONNOVA-exercise-assets.zip
            unzip -oq /tmp/IRONNOVA-exercise-assets.zip -d assets
          elif [ -f IRONNOVA-exercise-assets.zip ]; then
            unzip -oq IRONNOVA-exercise-assets.zip -d assets
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("assets")
          catalog_path = root / "iron-exercise-catalog.json"
          photo_catalog_path = root / "exercise-photo-catalog.json"
          media_dir = root / "iron-exercises"
          if not catalog_path.is_file() or not photo_catalog_path.is_file() or not media_dir.is_dir():
              raise SystemExit("ERROR: offline exercise assets are missing; refusing to build an incomplete APK.")
          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          exercises = catalog.get("exercises", [])
          if len(exercises) < 1000:
              raise SystemExit(f"ERROR: expected at least 1000 offline exercises, found {len(exercises)}.")
          images = [p for p in media_dir.rglob("*") if p.is_file() and p.suffix.lower() in {".webp", ".svg", ".jpg", ".jpeg", ".png"}]
          if len(images) < 1800:
              raise SystemExit(f"ERROR: expected at least 1800 exercise images, found {len(images)}.")
          refs = set()
          for item in exercises:
              flat = (item.get("images") or {}).get("flat") or {}
              for value in flat.values():
                  if isinstance(value, str) and value.startswith("assets/"):
                      refs.add(value)
          missing = [value for value in refs if not Path(value).is_file()]
          if missing:
              raise SystemExit(f"ERROR: {len(missing)} catalog image paths are missing; first: {missing[0]}")
          print(f"Validated {len(exercises)} offline exercises, {len(images)} local images and {len(refs)} referenced image paths.")
          PY

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/
          [ ! -d assets ] || cp -r assets www/
          [ ! -f manifest.webmanifest ] || cp manifest.webmanifest www/
          [ ! -f service-worker.js ] || cp service-worker.js www/
          [ ! -f sw.js ] || cp sw.js www/

      - name: Validate push bridge
        run: node --input-type=module --check < scripts/iron-push.js

      - name: Bundle native push bridge
        run: npx esbuild scripts/iron-push.js --bundle --format=iife --outfile=www/iron-push.js

      - name: Create Android project
        run: npx cap add android

      - name: Generate Android launcher icons
        run: python3 scripts/generate-icons.py --android-res android/app/src/main/res

      - name: Add Firebase Android configuration
        run: cp google-services.json android/app/google-services.json

      - name: Add Android media permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permissions = ['<uses-permission android:name="android.permission.RECORD_AUDIO" />', '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />']
          for permission in permissions:
              if permission not in s:
                  s = s.replace('<application', permission + '\n    <application', 1)
          p.write_text(s)
          PY

      - name: Sync Android
        run: npx cap sync android

      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ironnova-android-debug-keystore-v1

      - name: Ensure stable Android debug signing key
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRONNOVA-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
