
name: Build IRONNOVA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install icon generator dependency
        run: python3 -m pip install --disable-pip-version-check Pillow

      - name: Generate IRONNOVA app icons
        run: python3 scripts/generate-icons.py

      - name: Validate inline JavaScript
        run: node scripts/check-inline-js.mjs

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/
          [ ! -d assets ] || cp -r assets www/
          [ ! -f manifest.webmanifest ] || cp manifest.webmanifest www/
          [ ! -f service-worker.js ] || cp service-worker.js www/
          [ ! -f sw.js ] || cp sw.js www/

      - name: Validate push bridge
        run: node --input-type=module --check < scripts/iron-push.js

      - name: Bundle native push bridge
        run: npx esbuild scripts/iron-push.js --bundle --format=iife --outfile=www/iron-push.js

      - name: Create Android project
        run: npx cap add android

      - name: Generate Android launcher icons
        run: python3 scripts/generate-icons.py --android-res android/app/src/main/res

      - name: Add Firebase Android configuration
        run: cp google-services.json android/app/google-services.json

      - name: Add Android media permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permissions = ['<uses-permission android:name="android.permission.RECORD_AUDIO" />', '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />']
          for permission in permissions:
              if permission not in s:
                  s = s.replace('<application', permission + '\n    <application', 1)
          p.write_text(s)
          PY

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRONNOVA-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
